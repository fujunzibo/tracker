# Hyper Tracker 配置文件示例
# 复制此文件为 tracker.yaml 并根据实际情况修改配置

# 数据库连接字符串 (PostgreSQL)
# 格式: postgres://用户名:密码@主机:端口/数据库名?sslmode=disable
dsn: postgres://postgres:UpSQbG5uXCOmA4nk6z4j@localhost:15432/tracker?sslmode=disable

# HTTP 服务器配置
server:
  listen: "0.0.0.0:8080"  # API 服务监听地址
  secret: "-hashhub-"      # API 密钥

# CMM 配置
cmm:
  accessToken: ""          # CMM 访问令牌
  refreshToken: ""         # CMM 刷新令牌
  tokenTTL: 43200          # Token 有效期（秒）
  timeout: 10              # 请求超时时间（秒）

# 日志配置
log:
  level: "info"            # 日志级别: debug, info, warn, error
  format: "text"           # 日志格式: text, json
  stdout: true             # 是否输出到标准输出
  output: "logs/tracker.log"  # 日志文件路径（可选）
  max_age: 7               # 日志文件保留天数
  max_size: 100            # 单个日志文件最大大小（MB）
  max_backups: 10          # 保留的日志文件数量
  compress: true           # 是否压缩旧日志

# 网络配置
network:
  localAddrs: []           # 本地地址列表（可选）
  proxies: []              # 代理列表（可选）

# 数据采集配置
collect:
  segments: [1, 2, 3, 4]   # CMM 分段列表
  interval: 60             # 采集间隔（秒）
  rateLimit: 10            # 速率限制
  retryCount: 5            # 重试次数
  retryDelay: 1000         # 重试延迟（毫秒）
  blacklist: []            # 黑名单地址
  workerCount: 5           # 工作协程数量
  queueSize: 1000          # 队列大小
  batchInterval: 300       # 批处理间隔（秒）
  saveInterval: 2          # 保存间隔（秒）
  pointInterval: 86400     # 时间点间隔（秒）
  cmmExecs: []             # CMM 执行配置
  hyperExecs: []           # Hyperliquid 执行配置
  updatePositionSets: []   # 更新持仓的地址集合ID列表
  updatePositionInterval: 60  # 更新持仓间隔（秒）

# 跟单配置（可选）
follow:
  rpcUrl: ""               # RPC URL
  addressSets: []          # 地址集合ID列表
  excludeCoins: []         # 排除的币种
  followRatio: 1           # 跟单比例
  leverage: 5              # 杠杆倍数
  minFollowValue: 5        # 最小跟单价值
  maxFollowValue: 1000     # 最大跟单价值
  timeDiff: 1000           # 时间差（毫秒）
  mergeInterval: 1000      # 合并间隔（毫秒）
  perWsUserCount: 10       # 每个 WebSocket 用户数量
  msgIODir: ""             # 消息IO目录
  marketDataUrl: ""        # 市场数据URL
  listen: "127.0.0.1:3006" # 监听地址
  autoStart: false         # 自动启动
  copyPosition: false      # 复制持仓

